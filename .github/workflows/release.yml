name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - name: Build APK
        env:
          REMIXT_API_URL: ${{ vars.REMIXT_API_URL || secrets.REMIXT_API_URL }}
          REMIXT_WS_URL: ${{ vars.REMIXT_WS_URL || secrets.REMIXT_WS_URL || '' }}
        run: npm run build
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/remixt-app-chofer.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/remixt-app-chofer.apk \
              --title "REMIXT Chofer $GITHUB_REF_NAME" \
              --generate-notes
          fi
