<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#165be5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="REMIXT" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>REMIXT · Ingresar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23165BE5%27/%3E%3Cpath d=%27M10 23V9h6a5 5 0 0 1 0 10h-3l5 4%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body class="portal">
  <main class="login">
    <div class="login__brand">
      <span class="logo logo--lg">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5c-6.1 0-11 4.8-11 10.8C5 21 16 29.5 16 29.5S27 21 27 13.3C27 7.3 22.1 2.5 16 2.5Z" fill="none" stroke="#ffb219" stroke-width="3"/><path d="M10.5 15.5l1.1-3.3a1.6 1.6 0 0 1 1.5-1.1h5.8a1.6 1.6 0 0 1 1.5 1.1l1.1 3.3v2.7h-11v-2.7Z" fill="currentColor"/></svg>
        <strong>REMI<span>XT</span></strong>
      </span>
      <p>Tu remis, siempre cerca</p>
    </div>

    <section class="login__card phone--dark">
      <h1>Ingresar</h1>
      <p class="pcard__sub" id="loginSub">Acceso para el personal de la remisería.</p>

      <div class="role-switch" role="tablist" aria-label="Tipo de usuario">
        <button type="button" class="is-active" data-rol="operador" role="tab" aria-selected="true">Operador</button>
        <button type="button" data-rol="chofer" role="tab" aria-selected="false">Chofer</button>
      </div>

      <form class="pform" id="loginForm">
        <div class="pfield">
          <label for="loginUsuario" id="loginUsuarioLabel">Email</label>
          <input id="loginUsuario" name="usuario" type="email" autocomplete="username" placeholder="tu@email.com" required />
        </div>
        <div class="pfield">
          <label for="loginPassword">Clave</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p class="pform__error" id="loginError" role="alert" hidden></p>
        <button class="btn btn--primary btn--block" type="submit" id="loginBtn">Ingresar</button>
      </form>
    </section>

    <div class="login__alt">
      <p>¿Necesitás un remis? No hace falta registrarse.</p>
      <a class="btn btn--amber btn--block" href="pasajero.html">Pedir un remis</a>
    </div>
  </main>

  <p class="app-version" id="appVersion" aria-label="Versión de REMIXT">REMIXT</p>

  <script src="config.js"></script>
  <script src="pwa.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
